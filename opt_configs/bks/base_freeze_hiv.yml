dataset: ogbg-molhiv
aug: baseline
model_type: so_gnn-transformer
gnn_type: gin
gnn_virtual_node: false
graph_pooling: ccp
runs: 1
seed: 12344
batch_size: 256
lr: 0.001
start-eval: 1
scheduler: cosine
gnn_residual: true
optimizer: momentum
# transformer_norm_input: true
gnn_dropout: 0.5
gnn_JK: cat
fix_epochs: 10
freeze_type: "all"
pretrained_gnn: "pretrain/hiv_base.pt"
reduction_list: [64]
cheads: 2
use_weight: false
is_triu: true
use_bn: true
last_bn: false
cattn_drop: 0
cfeat_drop: 0
# 用最基础的模型